name: Offline commercial pilot tests
on:
  pull_request:
    paths:
      - 'pilot/**'
      - '.github/workflows/pilot-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline pilot tests
        run: node --test pilot/engine.test.mjs pilot/dashboard.test.mjs
